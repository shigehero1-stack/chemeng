title: はじめての化学工学
description: 化学工学を初めて学ぶ人から中級者まで向けに、単位と収支の基礎から流体・伝熱・分離・反応までを、公式の意味と計算例でていねいに解説します。
---
<section>
<p>化学工学は、実験室の化学反応を工場の規模で安全に、無駄なく動かすための学問です。このサイトでは、大学の講義や資格試験、現場の実務で最初につまずきやすいポイントを、公式の意味と具体的な計算例で一つずつ解説します。</p>
<p>はじめての方は「<a href="/basics/what-is-chemical-engineering.html">化学工学とは</a>」から順番に読むのがおすすめです。</p>
</section>
