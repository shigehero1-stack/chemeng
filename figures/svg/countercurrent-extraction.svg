<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230"><style>
text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;font-size:13px;fill:#1f2328}
.s{font-size:11.5px} .m{fill:#5b636d} .b{font-weight:700} .a{fill:#0f6e6a} .a2{fill:#c0612b} .a3{fill:#3b6fb6}
.ln{stroke:#1f2328;stroke-width:1.5;fill:none} .thin{stroke:#5b636d;stroke-width:1;fill:none}
.grid{stroke:#e3e3dc;stroke-width:1} .dash{stroke-dasharray:5 4} .dot{stroke-dasharray:2 3}
.c1{stroke:#0f6e6a;stroke-width:2.5;fill:none} .c2{stroke:#c0612b;stroke-width:2.5;fill:none} .c3{stroke:#3b6fb6;stroke-width:2.5;fill:none}
.eq{stroke:#1f2328;stroke-width:1.5;fill:#fff}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e6a"/></marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0612b"/></marker>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b636d"/></marker>
</defs><rect width="640" height="230" fill="#fff"/><rect x="70.0" y="80.0" width="110.0" height="60.0" rx="6" fill="#e4f2f0" stroke="#1f2328" stroke-width="1.5"/><text x="125.0" y="107.0" text-anchor="middle" class="b">第1段</text><text x="125.0" y="124.0" text-anchor="middle" class="s m">混合して分離</text><line x1="182.0" y1="98.0" x2="238.0" y2="98.0" stroke="#c0612b" stroke-width="2" marker-end="url(#ar2)"/><line x1="238.0" y1="124.0" x2="182.0" y2="124.0" stroke="#3b6fb6" stroke-width="2" marker-end="url(#ar3)"/><rect x="240.0" y="80.0" width="110.0" height="60.0" rx="6" fill="#e4f2f0" stroke="#1f2328" stroke-width="1.5"/><text x="295.0" y="107.0" text-anchor="middle" class="b">第2段</text><text x="295.0" y="124.0" text-anchor="middle" class="s m">混合して分離</text><line x1="352.0" y1="98.0" x2="408.0" y2="98.0" stroke="#c0612b" stroke-width="2" marker-end="url(#ar2)"/><line x1="408.0" y1="124.0" x2="352.0" y2="124.0" stroke="#3b6fb6" stroke-width="2" marker-end="url(#ar3)"/><rect x="410.0" y="80.0" width="110.0" height="60.0" rx="6" fill="#e4f2f0" stroke="#1f2328" stroke-width="1.5"/><text x="465.0" y="107.0" text-anchor="middle" class="b">第3段</text><text x="465.0" y="124.0" text-anchor="middle" class="s m">混合して分離</text><line x1="10.0" y1="98.0" x2="68.0" y2="98.0" stroke="#c0612b" stroke-width="2" marker-end="url(#ar2)"/><text x="10.0" y="86.0" class="s b a2">原料</text><line x1="522.0" y1="98.0" x2="582.0" y2="98.0" stroke="#c0612b" stroke-width="2" marker-end="url(#ar2)"/><text x="584.0" y="102.0" class="s b a2">抽残液</text><line x1="582.0" y1="124.0" x2="522.0" y2="124.0" stroke="#3b6fb6" stroke-width="2" marker-end="url(#ar3)"/><text x="584.0" y="128.0" class="s b a3">抽剤</text><line x1="68.0" y1="124.0" x2="10.0" y2="124.0" stroke="#3b6fb6" stroke-width="2" marker-end="url(#ar3)"/><text x="10.0" y="144.0" class="s b a3">抽出液</text><text x="320.0" y="40.0" text-anchor="middle" class="b">原料と抽剤を逆向きに流す</text><text x="320.0" y="180.0" text-anchor="middle" class="s m">溶質の薄くなった原料が、新しい抽剤と出会うので効率がよい</text><text x="320.0" y="200.0" text-anchor="middle" class="s">残る割合 x_N/x₀ = (E − 1)/(E<tspan dy="-6" font-size="0.75em">N+1</tspan><tspan dy="6"> </tspan> − 1)</text></svg>
