</defs><rect width="600" height="230" fill="#fff"/><text x="110.0" y="52.0" text-anchor="end" class="b">(1) m = 0.5</text><rect x="120.0" y="30.0" width="73.3" height="34.0" rx="0" fill="#fbe9df" stroke="#1f2328" stroke-width="1"/><rect x="193.3" y="30.0" width="3.7" height="34.0" rx="0" fill="#e3ecf8" stroke="#1f2328" stroke-width="1"/><text x="156.7" y="52.0" text-anchor="middle" class="s b">気相 20</text><text x="203.0" y="52.0" class="s">液相 1</text><text x="120.0" y="82.0" class="s b a2">→ ガス側律速（気相側の抵抗が 95%）</text><text x="110.0" y="138.0" text-anchor="end" class="b">(2) m = 50</text><rect x="120.0" y="116.0" width="73.3" height="34.0" rx="0" fill="#fbe9df" stroke="#1f2328" stroke-width="1"/><rect x="193.3" y="116.0" width="366.7" height="34.0" rx="0" fill="#e3ecf8" stroke="#1f2328" stroke-width="1"/><text x="156.7" y="138.0" text-anchor="middle" class="s b">気相 20</text><text x="376.7" y="138.0" text-anchor="middle" class="s b">液相 m/k_x = 100</text><text x="120.0" y="168.0" class="s b a3">→ 液側律速（気相側の抵抗が 17%）</text><text x="300.0" y="222.0" text-anchor="middle" class="s m">1/K_y = 1/k_y + m/k_x の内訳（例題、単位 m²s/mol）</text></svg>
