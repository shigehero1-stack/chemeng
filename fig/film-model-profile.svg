<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e6a"/></marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0612b"/></marker>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b636d"/></marker>
</defs><rect width="600" height="280" fill="#fff"/><rect x="40.0" y="40.0" width="80.0" height="200.0" rx="0" fill="#d9d9d2" stroke="#1f2328" stroke-width="1.5"/><text x="80.0" y="140.0" text-anchor="middle" class="b">表面</text><rect x="120" y="40" width="140" height="200" fill="#e4f2f0" opacity="0.8"/><line x1="260.0" y1="40.0" x2="260.0" y2="240.0" class="thin dash"/><text x="190.0" y="56.0" text-anchor="middle" class="s b a">境膜（厚さ δ）</text><text x="190.0" y="72.0" text-anchor="middle" class="s m">拡散だけで運ばれる</text><text x="420.0" y="58.0" text-anchor="middle" class="s b">流体の本体（よく混ざっている）</text><path d="M120.0,115.0 L260.0,200.0 L560.0,200.0" class="c1"/><circle cx="120.0" cy="115.0" r="5.0" fill="#0f6e6a" stroke="#fff" stroke-width="1.5"/><text x="128.0" y="109.0" class="s b">C_A,表面</text><text x="540.0" y="190.0" text-anchor="end" class="s b">C_A,本体</text><line x1="310.0" y1="160.0" x2="380.0" y2="160.0" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#ar3)"/><line x1="310.0" y1="195.0" x2="380.0" y2="195.0" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#ar3)"/><line x1="310.0" y1="230.0" x2="380.0" y2="230.0" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#ar3)"/><text x="390.0" y="224.0" class="s a3">流れ</text><line x1="150.0" y1="130.0" x2="230.0" y2="162.0" stroke="#c0612b" stroke-width="2" marker-end="url(#ar2)"/><text x="300.0" y="268.0" text-anchor="middle" class="s">k = D_AB / δ：流れが速いほど境膜が薄くなり、k が大きくなる</text></svg>
