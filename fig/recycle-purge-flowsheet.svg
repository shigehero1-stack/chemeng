<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270"><style>
text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;font-size:13px;fill:#1f2328}
.s{font-size:11.5px} .m{fill:#5b636d} .b{font-weight:700} .a{fill:#0f6e6a} .a2{fill:#c0612b} .a3{fill:#3b6fb6}
.ln{stroke:#1f2328;stroke-width:1.5;fill:none} .thin{stroke:#5b636d;stroke-width:1;fill:none}
.grid{stroke:#e3e3dc;stroke-width:1} .dash{stroke-dasharray:5 4} .dot{stroke-dasharray:2 3}
.c1{stroke:#0f6e6a;stroke-width:2.5;fill:none} .c2{stroke:#c0612b;stroke-width:2.5;fill:none} .c3{stroke:#3b6fb6;stroke-width:2.5;fill:none}
.eq{stroke:#1f2328;stroke-width:1.5;fill:#fff}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e6a"/></marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0612b"/></marker>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b636d"/></marker>
</defs><rect width="700" height="270" fill="#fff"/><text x="10.0" y="98.0" class="s b">新しい原料</text><text x="10.0" y="134.0" class="s m">A ＋ 不活性成分 I</text><line x1="10.0" y1="114.0" x2="110.0" y2="114.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><circle cx="130.0" cy="114.0" r="18.0" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><text x="130.0" y="119.0" text-anchor="middle" class="s b">混合</text><line x1="148.0" y1="114.0" x2="208.0" y2="114.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="210.0" y="86.0" width="120.0" height="56.0" rx="6" fill="#fbe9df" stroke="#1f2328" stroke-width="1.5"/><text x="270.0" y="111.0" text-anchor="middle" class="b">反応器</text><text x="270.0" y="128.0" text-anchor="middle" class="s m">A → B（1回で X₁）</text><line x1="330.0" y1="114.0" x2="390.0" y2="114.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="392.0" y="86.0" width="110.0" height="56.0" rx="6" fill="#e3ecf8" stroke="#1f2328" stroke-width="1.5"/><text x="447.0" y="118.5" text-anchor="middle" class="b">分離器</text><line x1="447.0" y1="142.0" x2="447.0" y2="202.0" stroke="#0f6e6a" stroke-width="2" marker-end="url(#ara)"/><text x="455.0" y="194.0" class="s b a">製品 B</text><line x1="502.0" y1="114.0" x2="562.0" y2="114.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="506.0" y="102.0" class="s">A と I</text><circle cx="580.0" cy="114.0" r="16.0" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><text x="580.0" y="119.0" text-anchor="middle" class="s b">分</text><line x1="596.0" y1="114.0" x2="690.0" y2="114.0" stroke="#c0612b" stroke-width="2" marker-end="url(#ar2)"/><text x="612.0" y="102.0" class="s b a2">パージ（割合 p）</text><path d="M580,98 L580,30 L130,30 L130,96" class="ln" style="stroke-width:2" marker-end="url(#ar)"/><text x="355.0" y="22.0" text-anchor="middle" class="s b">リサイクル（割合 1 − p）</text><text x="350.0" y="250.0" text-anchor="middle" class="s m">I が系外に出る道はパージだけなので、循環する I の量はパージ率に反比例する</text></svg>
