<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300"><style>
text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;font-size:13px;fill:#1f2328}
.s{font-size:11.5px} .m{fill:#5b636d} .b{font-weight:700} .a{fill:#0f6e6a} .a2{fill:#c0612b} .a3{fill:#3b6fb6}
.ln{stroke:#1f2328;stroke-width:1.5;fill:none} .thin{stroke:#5b636d;stroke-width:1;fill:none}
.grid{stroke:#e3e3dc;stroke-width:1} .dash{stroke-dasharray:5 4} .dot{stroke-dasharray:2 3}
.c1{stroke:#0f6e6a;stroke-width:2.5;fill:none} .c2{stroke:#c0612b;stroke-width:2.5;fill:none} .c3{stroke:#3b6fb6;stroke-width:2.5;fill:none}
.eq{stroke:#1f2328;stroke-width:1.5;fill:#fff}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e6a"/></marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0612b"/></marker>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b636d"/></marker>
</defs><rect width="620" height="300" fill="#fff"/><rect x="170.0" y="70.0" width="90.0" height="170.0" rx="14" fill="#e4f2f0" stroke="#1f2328" stroke-width="2"/><text x="215.0" y="98.0" text-anchor="middle" class="b">塔 A</text><text x="215.0" y="160.0" text-anchor="middle" class="s b">吸着中</text><rect x="360.0" y="70.0" width="90.0" height="170.0" rx="14" fill="#fbe9df" stroke="#1f2328" stroke-width="2"/><text x="405.0" y="98.0" text-anchor="middle" class="b">塔 B</text><text x="405.0" y="160.0" text-anchor="middle" class="s b">再生中</text><text x="215.0" y="178.0" text-anchor="middle" class="s m">高い圧力</text><text x="405.0" y="178.0" text-anchor="middle" class="s m">低い圧力</text><line x1="30.0" y1="225.0" x2="168.0" y2="225.0" stroke="#1f2328" stroke-width="2.2" marker-end="url(#ar)"/><text x="30.0" y="215.0" class="s b">原料ガス（空気）</text><text x="30.0" y="250.0" class="s m">圧縮機で加圧</text><path d="M215,70 L215,30 L590,30" class="ln" style="stroke-width:2.2" marker-end="url(#ar)"/><text x="470.0" y="22.0" text-anchor="middle" class="s b a">製品（吸着されにくい成分）</text><path d="M405,70 L405,46 L232,46" class="c1" style="stroke-width:1.6" marker-end="url(#ara)"/><text x="310.0" y="62.0" text-anchor="middle" class="s a">製品の一部でパージ</text><path d="M405,240 L405,275 L590,275" class="ln" style="stroke-width:2.2" marker-end="url(#ar)"/><text x="470.0" y="266.0" text-anchor="middle" class="s b a2">排ガス（脱着した成分）</text><text x="310.0" y="296.0" text-anchor="middle" class="s m">一定時間ごとに A と B の役割を入れ替える</text></svg>
