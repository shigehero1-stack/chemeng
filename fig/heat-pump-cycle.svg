<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320"><style>
text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;font-size:13px;fill:#1f2328}
.s{font-size:11.5px} .m{fill:#5b636d} .b{font-weight:700} .a{fill:#0f6e6a} .a2{fill:#c0612b} .a3{fill:#3b6fb6}
.ln{stroke:#1f2328;stroke-width:1.5;fill:none} .thin{stroke:#5b636d;stroke-width:1;fill:none}
.grid{stroke:#e3e3dc;stroke-width:1} .dash{stroke-dasharray:5 4} .dot{stroke-dasharray:2 3}
.c1{stroke:#0f6e6a;stroke-width:2.5;fill:none} .c2{stroke:#c0612b;stroke-width:2.5;fill:none} .c3{stroke:#3b6fb6;stroke-width:2.5;fill:none}
.eq{stroke:#1f2328;stroke-width:1.5;fill:#fff}
</style><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e6a"/></marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0612b"/></marker>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b636d"/></marker>
</defs><rect width="620" height="320" fill="#fff"/><rect x="230.0" y="30.0" width="160.0" height="50.0" rx="6" fill="#fbe9df" stroke="#1f2328" stroke-width="1.5"/><text x="310.0" y="59.5" text-anchor="middle" class="b" style="font-size:12.5px">凝縮器（熱を出す）</text><rect x="230.0" y="230.0" width="160.0" height="50.0" rx="6" fill="#e3ecf8" stroke="#1f2328" stroke-width="1.5"/><text x="310.0" y="259.5" text-anchor="middle" class="b" style="font-size:12.5px">蒸発器（熱を吸う）</text><circle cx="470.0" cy="155.0" r="32.0" fill="#e4f2f0" stroke="#1f2328" stroke-width="1.5"/><text x="470.0" y="150.0" text-anchor="middle" class="s b">圧縮機</text><text x="470.0" y="166.0" text-anchor="middle" class="s a">電力 W</text><polygon points="140,140 160,140 150,155" fill="#1f2328"/><polygon points="140,170 160,170 150,155" fill="#1f2328"/><text x="130.0" y="159.0" text-anchor="end" class="s b">膨張弁</text><path d="M390,255 L470,255 L470,189" class="ln" style="stroke-width:2" marker-end="url(#ar)"/><path d="M470,123 L470,55 L392,55" class="ln" style="stroke-width:2" marker-end="url(#ar)"/><path d="M230,55 L150,55 L150,138" class="ln" style="stroke-width:2" marker-end="url(#ar)"/><path d="M150,172 L150,255 L228,255" class="ln" style="stroke-width:2" marker-end="url(#ar)"/><line x1="310.0" y1="28.0" x2="310.0" y2="2.0" stroke="#c0612b" stroke-width="2.4" marker-end="url(#ar2)"/><text x="320.0" y="14.0" class="s b a2">Q_H = Q_L + W（高温、例：80 °C の温水）</text><line x1="310.0" y1="318.0" x2="310.0" y2="284.0" stroke="#3b6fb6" stroke-width="2.4" marker-end="url(#ar3)"/><text x="320.0" y="306.0" class="s b a3">Q_L（低温、例：30 °C の排温水）</text><line x1="560.0" y1="155.0" x2="504.0" y2="155.0" stroke="#0f6e6a" stroke-width="2" marker-end="url(#ara)"/><text x="498.0" y="116.0" class="s m">高温・高圧の気体</text><text x="160.0" y="110.0" class="s m">高圧の液体</text><text x="160.0" y="210.0" class="s m">低温・低圧</text></svg>
