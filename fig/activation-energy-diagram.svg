<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0612b"/></marker>
<marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b636d"/></marker>
</defs><rect width="560" height="280" fill="#fff"/><line x1="30.0" y1="240.0" x2="30.0" y2="30.0" class="ln" marker-end="url(#ar)"/><text x="22.0" y="140.0" text-anchor="middle" transform="rotate(-90 22.0 140.0)">エネルギー</text><line x1="30.0" y1="240.0" x2="520.0" y2="240.0" class="ln"/><text x="290.0" y="266.0" text-anchor="middle" class="s">反応の進み具合</text><path d="M70,190 L150,190 C230,190 240,60 290,60 C340,60 350,215 430,215 L510,215" class="c1"/><text x="110.0" y="182.0" text-anchor="middle" class="s b">反応物</text><text x="470.0" y="207.0" text-anchor="middle" class="s b">生成物</text><line x1="150.0" y1="60.0" x2="290.0" y2="60.0" class="thin dot"/><line x1="130.0" y1="190.0" x2="130.0" y2="62.0" class="thin" marker-end="url(#arm)" marker-start="url(#arm)"/><text x="124.0" y="122.0" text-anchor="end" class="s b a2">活性化</text><text x="124.0" y="138.0" text-anchor="end" class="s b a2">エネルギー E</text><text x="300.0" y="54.0" class="s m">越えなければならない山</text><text x="330.0" y="150.0" class="s">温度が高いほど、山を越えられる</text><text x="330.0" y="168.0" class="s">分子の割合が増える → 速く反応する</text></svg>
